# Packit configuration for facetimehd-kmod-rpm
# https://packit.dev/docs/configuration/
#
# This is a monorepo of three RPM specs that build from two upstream sources
# (patjak/facetimehd for the driver and metadata packages, patjak/facetimehd-firmware
# for the firmware). There is no source code here, so each package overrides Packit's
# default "archive this repo" behaviour with a create-archive action that downloads the
# tarball named by the spec's Source (spectool resolves %forgesource) next to the spec.
#
# Packit drives two flows:
#   - pull_request -> scratch Copr project (mulderje/facetimehd-kmod-pr) for per-PR
#     verification. The kmod spec's %check compiles the driver against the newest
#     kernel-devel, so a green build means it compiles.
#   - push to main -> official Copr project (mulderje/facetimehd-kmod), consumed
#     downstream (e.g. by mulderje/ublue-oldair).
#
# Packit's release jobs (propose_downstream, pull_from_upstream) only target Fedora
# dist-git, so new upstream tags are tracked by .github/workflows/upstream-bump.yml,
# which opens bump PRs that bump-merge.yml merges once these builds pass.
#
# enable_net is only set for facetimehd-firmware: its Makefile downloads Apple's driver
# at %build time, and Packit defaults enable_net to False.

packages:
  facetimehd:
    downstream_package_name: facetimehd
    paths:
      - ./facetimehd
    specfile_path: facetimehd.spec
    actions:
      # Fetch the tarball named by the spec's Source0 (via %forgesource) instead of
      # hardcoding URLs; the last stdout line must be the archive file name.
      create-archive:
        - "bash -c 'spectool -g facetimehd.spec >&2'"
        - "bash -c 'spectool -l facetimehd.spec | grep -m1 ^Source0: | rev | cut -d/ -f1 | rev'"

  facetimehd-kmod:
    downstream_package_name: facetimehd-kmod
    paths:
      - ./facetimehd-kmod
    specfile_path: facetimehd-kmod.spec
    actions:
      # Fetch the tarball named by the spec's Source0 (via %forgesource) instead of
      # hardcoding URLs; the last stdout line must be the archive file name.
      create-archive:
        - "bash -c 'spectool -g facetimehd-kmod.spec >&2'"
        - "bash -c 'spectool -l facetimehd-kmod.spec | grep -m1 ^Source0: | rev | cut -d/ -f1 | rev'"

  facetimehd-firmware:
    downstream_package_name: facetimehd-firmware
    paths:
      - ./facetimehd-firmware
    specfile_path: facetimehd-firmware.spec
    actions:
      # Fetch the tarball named by the spec's Source0 (via %forgesource) instead of
      # hardcoding URLs; the last stdout line must be the archive file name.
      create-archive:
        - "bash -c 'spectool -g facetimehd-firmware.spec >&2'"
        - "bash -c 'spectool -l facetimehd-firmware.spec | grep -m1 ^Source0: | rev | cut -d/ -f1 | rev'"

jobs:
  # Per-PR scratch builds in a separate Copr project so the official Copr never
  # sees unreviewed code. Targets track Fedora's lifecycle (fedora-all) incl. rawhide.
  - job: copr_build
    trigger: pull_request
    packages: [facetimehd, facetimehd-kmod]
    owner: mulderje
    project: facetimehd-kmod-pr
    targets:
      - fedora-all-x86_64

  # enable_net is only needed by facetimehd-firmware: its upstream Makefile
  # curl-downloads the driver installer from Apple at %build time. Packit defaults
  # enable_net to False, which overrides the Copr project-level toggle.
  - job: copr_build
    trigger: pull_request
    packages: [facetimehd-firmware]
    owner: mulderje
    project: facetimehd-kmod-pr
    targets:
      - fedora-all-x86_64
    enable_net: true

  # Merges to main publish to the official Copr consumed by ublue-oldair.
  - job: copr_build
    trigger: commit
    branch: main
    packages: [facetimehd, facetimehd-kmod]
    owner: mulderje
    project: facetimehd-kmod
    targets:
      - fedora-all-x86_64

  - job: copr_build
    trigger: commit
    branch: main
    packages: [facetimehd-firmware]
    owner: mulderje
    project: facetimehd-kmod
    targets:
      - fedora-all-x86_64
    enable_net: true
