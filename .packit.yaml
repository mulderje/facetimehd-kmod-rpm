# .packit.yaml
packages:
  facetimehd:
    upstream_project_url: https://github.com
    upstream_package_name: facetimehd
    upstream_tag_template: "{version}"
    specfile_path: facetimehd/facetimehd.spec
    files_to_sync:
      - facetimehd/facetimehd.spec

  facetimehd-kmod:
    upstream_project_url: https://github.com
    upstream_package_name: facetimehd-kmod
    upstream_tag_template: "{version}"
    specfile_path: facetimehd-kmod/facetimehd-kmod.spec
    files_to_sync:
      - facetimehd-kmod/facetimehd-kmod.spec

  facetimehd-firmware:
    upstream_project_url: https://github.com-firmware
    upstream_package_name: facetimehd-firmware
    upstream_tag_template: "v{version}"
    specfile_path: facetimehd-firmware/facetimehd-firmware.spec
    files_to_sync:
      - facetimehd-firmware/facetimehd-firmware.spec

jobs:
  # 1. Independent upstream release polling across the distinct repos
  - job: propose_downstream
    trigger: release
    packages: [facetimehd, facetimehd-kmod, facetimehd-firmware]

  # 2. PR Scratch Builds restricted to x86_64 with network access enabled
  - job: copr_build
    trigger: pull_request
    packages: [facetimehd, facetimehd-kmod, facetimehd-firmware]
    enable_net: true
    targets:
      - fedora-all-x86_64

  # 3. Stable Production Builds restricted to x86_64 with network access enabled
  - job: copr_build
    trigger: commit
    branch: main
    packages: [facetimehd, facetimehd-kmod, facetimehd-firmware]
    project: mulderje/facetimehd-kmod
    enable_net: true
    targets:
      - fedora-all-x86_64
