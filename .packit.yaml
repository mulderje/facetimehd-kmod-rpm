# Packit configuration for facetimehd-kmod-rpm
# https://packit.dev/docs/configuration/
#
# This is a monorepo containing three downstream RPM specs that build from two
# upstream sources (patjak/facetimehd for the driver + metadata packages, and
# patjak/facetimehd-firmware for the firmware extractor). There is no source
# code in this repo — only specs — so each package overrides Packit's default
# "archive this repo" behavior with a create-archive action that downloads the
# correct upstream tarball from GitHub and drops it next to the spec.
#
# Packit drives two flows:
#   - pull_request -> scratch Copr project (mulderje/facetimehd-kmod-pr) for
#     per-PR verification before merge.
#   - push to main -> official Copr project (mulderje/facetimehd-kmod) whose
#     RPMs are consumed downstream (e.g. by mulderje/ublue-oldair).
#
# pull_from_upstream is intentionally disabled until the build is stable
# across the kernel versions we care about; when enabled, upstream_project_url
# will need per-package handling (Packit currently only honors it at the
# top level, so the firmware package's separate upstream repo is deferred).

packages:
  facetimehd:
    downstream_package_name: facetimehd
    paths:
      - ./facetimehd
    specfile_path: facetimehd.spec
    actions:
      # Fetch the tarball named by the spec's Source0 (via %forgesource) instead of
      # hardcoding URLs; the last stdout line must be the archive file name.
      create-archive:
        - "bash -c 'spectool -g facetimehd.spec >&2'"
        - "bash -c 'spectool -l facetimehd.spec | grep -m1 ^Source0: | rev | cut -d/ -f1 | rev'"

  facetimehd-kmod:
    downstream_package_name: facetimehd-kmod
    paths:
      - ./facetimehd-kmod
    specfile_path: facetimehd-kmod.spec
    actions:
      # Fetch the tarball named by the spec's Source0 (via %forgesource) instead of
      # hardcoding URLs; the last stdout line must be the archive file name.
      create-archive:
        - "bash -c 'spectool -g facetimehd-kmod.spec >&2'"
        - "bash -c 'spectool -l facetimehd-kmod.spec | grep -m1 ^Source0: | rev | cut -d/ -f1 | rev'"

  facetimehd-firmware:
    downstream_package_name: facetimehd-firmware
    paths:
      - ./facetimehd-firmware
    specfile_path: facetimehd-firmware.spec
    actions:
      # Fetch the tarball named by the spec's Source0 (via %forgesource) instead of
      # hardcoding URLs; the last stdout line must be the archive file name.
      create-archive:
        - "bash -c 'spectool -g facetimehd-firmware.spec >&2'"
        - "bash -c 'spectool -l facetimehd-firmware.spec | grep -m1 ^Source0: | rev | cut -d/ -f1 | rev'"

jobs:
  # Per-PR scratch builds in a separate Copr project so the official Copr never
  # sees unreviewed code. Targets track Fedora's lifecycle (fedora-all) incl. rawhide.
  - job: copr_build
    trigger: pull_request
    packages: [facetimehd, facetimehd-kmod]
    owner: mulderje
    project: facetimehd-kmod-pr
    targets:
      - fedora-all-x86_64

  # enable_net is only needed by facetimehd-firmware: its upstream Makefile
  # curl-downloads the driver installer from Apple at %build time. Packit defaults
  # enable_net to False, which overrides the Copr project-level toggle.
  - job: copr_build
    trigger: pull_request
    packages: [facetimehd-firmware]
    owner: mulderje
    project: facetimehd-kmod-pr
    targets:
      - fedora-all-x86_64
    enable_net: true
    # OpenScanHub builds the baseline SRPM in its own chroot without network, so the
    # firmware's build-time download always fails there.
    osh_diff_scan_after_copr_build: false

  # Merges to main publish to the official Copr consumed by ublue-oldair.
  - job: copr_build
    trigger: commit
    branch: main
    packages: [facetimehd, facetimehd-kmod]
    owner: mulderje
    project: facetimehd-kmod
    targets:
      - fedora-all-x86_64

  - job: copr_build
    trigger: commit
    branch: main
    packages: [facetimehd-firmware]
    owner: mulderje
    project: facetimehd-kmod
    targets:
      - fedora-all-x86_64
    enable_net: true
