# Runs the repo's own shell tests and checks that workflow and Packit config parse.
# RPM builds are tested by Packit on Copr, not here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run script tests
        run: |
          shopt -s nullglob
          status=0
          for t in .github/scripts/test-*.sh; do
            echo "== $t"
            bash "$t" || status=1
          done
          exit $status

      - name: Parse workflows and Packit config
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('.github/workflows/*.yml') + ['.packit.yaml']:
              try:
                  yaml.safe_load(open(f))
                  print('ok', f)
              except Exception as e:
                  print('BAD', f, e)
                  bad = 1
          sys.exit(bad)
          PY
