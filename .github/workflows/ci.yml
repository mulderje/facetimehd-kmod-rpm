# Runs the repo's own shell tests and checks that workflow and Packit config parse.
# RPM builds are tested by Packit on Copr, not here.
name: CI

# Only the files these checks cover trigger a run. Bump and revert PRs, which the bot opens
# and which only touch spec files, therefore never create a run: GitHub holds workflow runs
# from github-actions[bot] PRs for manual approval, and nothing here needs to run for them.
on:
  pull_request:
    paths:
      - ".github/**"
      - ".packit.yaml"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - ".packit.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run script tests
        run: |
          shopt -s nullglob
          status=0
          for t in .github/scripts/test-*.sh; do
            echo "== $t"
            bash "$t" || status=1
          done
          exit $status

      - name: Parse workflows and Packit config
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = 0
          for f in glob.glob('.github/workflows/*.yml') + ['.packit.yaml']:
              try:
                  yaml.safe_load(open(f))
                  print('ok', f)
              except Exception as e:
                  print('BAD', f, e)
                  bad = 1
          sys.exit(bad)
          PY
