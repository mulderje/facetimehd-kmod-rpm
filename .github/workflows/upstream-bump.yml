# Open a PR when patjak/facetimehd or patjak/facetimehd-firmware tag a new release.
# Packit's release jobs only target Fedora dist-git (and need the Packit app on the
# upstream repo), so release tracking for this spec-only repo lives here instead.
# The PR this opens is built on Copr by Packit like any other PR, and the same run then
# follows it through the pipeline (.github/scripts/bump-chain.sh): wait for Packit's PR
# builds, merge when green (or comment and ask the owner for a review when red), wait for
# the builds on main, and open a revert PR if they fail. bump-merge.yml and
# main-watchdog.yml sweep as a safety net.
name: Upstream bump

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Open a bump PR even if the specs already have the latest tag (pipeline test, adds a changelog entry only)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash .github/scripts/test-bump-spec.sh

  bump:
    needs: test
    runs-on: ubuntu-latest
    # Packit's builds take about ten minutes per phase; leave generous room
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: facetimehd
            upstream: https://github.com/patjak/facetimehd
            specs: facetimehd/facetimehd.spec facetimehd-kmod/facetimehd-kmod.spec
          - name: facetimehd-firmware
            upstream: https://github.com/patjak/facetimehd-firmware
            specs: facetimehd-firmware/facetimehd-firmware.spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check for a newer upstream tag and update the specs
        id: bump
        env:
          UPSTREAM: ${{ matrix.upstream }}
          SPECS: ${{ matrix.specs }}
          FORCE: ${{ inputs.force }}
        run: |
          first=${SPECS%% *}
          current=$(sed -n 's/^%global tag[[:space:]]\+//p' "$first")
          latest=$(bash .github/scripts/bump-spec.sh latest-tag "$UPSTREAM")
          echo "current=$current latest=$latest"
          if [ -n "$latest" ] && { [ "$FORCE" = "true" ] || bash .github/scripts/bump-spec.sh needs-bump "$current" "$latest"; }; then
            for spec in $SPECS; do
              bash .github/scripts/bump-spec.sh apply "$spec" "$latest"
            done
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the bump PR
        id: cpr
        if: steps.bump.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: bump/${{ matrix.name }}
          title: Update ${{ matrix.name }} to ${{ steps.bump.outputs.version }}
          commit-message: Update ${{ matrix.name }} to ${{ steps.bump.outputs.version }}
          body: |
            Automated bump to upstream release ${{ steps.bump.outputs.version }}
            (${{ matrix.upstream }}). Packit will build it on Copr; check those
            builds before merging, as new releases can need spec changes.
            ${{ inputs.force && 'Pipeline test: forced run for the current upstream version.' || '' }}

            Signed-off-by: Jon Mulder <jon.e.mulder@gmail.com>

      - name: Follow the PR through Packit, merge and the main builds
        if: >-
          steps.cpr.outputs.pull-request-number != '' &&
          (steps.cpr.outputs.pull-request-operation == 'created' ||
           steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SIGNOFF: "Signed-off-by: Jon Mulder <jon.e.mulder@gmail.com>"
        run: |
          # Leave the spec edits behind; the chain works from main
          git reset -q --hard
          git clean -fdq
          git fetch -q origin main
          git switch -q --detach origin/main
          bash .github/scripts/bump-chain.sh "$PR_NUMBER"
