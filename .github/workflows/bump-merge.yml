# Safety net for upstream-bump.yml, which merges its own PRs. Runs when Packit reports a
# finished check (not delivered for PRs opened with the workflow token, so that alone is
# not enough), when an upstream-bump run ends without succeeding (died, cancelled or timed
# out), and on manual dispatch; the daily bump run also sweeps leftovers before it starts.
# Logic: .github/scripts/gate-run.sh (tested by test-gate-run.sh and test-pr-gate.sh).
name: Bump merge

on:
  check_run:
    types: [completed]
  workflow_run:
    workflows: ["Upstream bump"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'check_run' && github.event.check_run.app.slug == 'packit-as-a-service') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success')
    runs-on: ubuntu-latest
    # One run at a time so a sweep and a check event cannot both try to merge a PR
    concurrency:
      group: bump-merge
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.check_run.head_sha }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Added to every squash commit this workflow creates
      SIGNOFF: "Signed-off-by: Jon Mulder <jon.e.mulder@gmail.com>"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate and merge
        run: bash .github/scripts/gate-run.sh
