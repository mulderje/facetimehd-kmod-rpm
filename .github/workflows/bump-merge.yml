# Merge bot-opened bump/revert PRs once every Packit PR build has passed, or say why not.
# Packit reports its builds as check runs, which trigger this workflow, but those events
# are not delivered for PRs opened with the workflow token, so a 10-minute sweep covers
# them. Logic: .github/scripts/gate-run.sh (tested by test-gate-run.sh and test-pr-gate.sh).
name: Bump merge

on:
  check_run:
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  gate:
    if: github.event_name != 'check_run' || github.event.check_run.app.slug == 'packit-as-a-service'
    runs-on: ubuntu-latest
    # One run at a time so a sweep and a check event cannot both try to merge a PR
    concurrency:
      group: bump-merge
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.check_run.head_sha }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Added to every squash commit this workflow creates
      SIGNOFF: "Signed-off-by: Jon Mulder <jon.e.mulder@gmail.com>"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gate and merge
        run: bash .github/scripts/gate-run.sh
