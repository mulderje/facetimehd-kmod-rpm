# Watch Packit's builds of main commits that came from a merged bump PR. If a package the
# bump changed fails to build, open a revert PR (merged by bump-merge.yml once its own
# builds pass) and say why. The next daily upstream-bump run retries the bump.
# check_run events are not reliably delivered for commits merged with the workflow token,
# so a 15-minute sweep covers the latest commits too.
# Logic: .github/scripts/watchdog-run.sh (tested by test-watchdog-run.sh and
# test-watchdog-decide.sh).
name: Main watchdog

on:
  check_run:
    types: [completed]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  watch:
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.app.slug == 'packit-as-a-service' &&
       startsWith(github.event.check_run.name, 'rpm-build:main:'))
    runs-on: ubuntu-latest
    concurrency:
      group: main-watchdog
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.check_run.head_sha }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the main builds of bump commits
        run: bash .github/scripts/watchdog-run.sh
